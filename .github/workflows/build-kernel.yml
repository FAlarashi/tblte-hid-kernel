name: Build tblte HID kernel

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex build-essential device-tree-compiler libssl-dev libelf-dev python3 wget xz-utils

      - name: Fetch legacy Android ARM GCC 4.9
        run: |
          set -eux
          mkdir -p "$HOME/toolchains"
          TOOLCHAIN_ROOT="$HOME/toolchains/arm-linux-androideabi-4.9"
          TOOLCHAIN_ARCHIVE="$RUNNER_TEMP/arm-linux-androideabi-4.9.tar.gz"
          TOOLCHAIN_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/android10-release.tar.gz"

          wget -q --show-progress "$TOOLCHAIN_URL" -O "$TOOLCHAIN_ARCHIVE"
          mkdir -p "$TOOLCHAIN_ROOT"
          tar -xzf "$TOOLCHAIN_ARCHIVE" -C "$TOOLCHAIN_ROOT"

          echo '=== TOOLCHAIN BINARIES ==='
          find "$TOOLCHAIN_ROOT/bin" -maxdepth 1 \( -type f -o -type l \) -print | sort | head -100

          GCC="$TOOLCHAIN_ROOT/bin/arm-linux-androideabi-gcc"
          GXX="$TOOLCHAIN_ROOT/bin/arm-linux-androideabi-g++"
          test -x "$GCC"
          test -x "$GXX"

          TOOLCHAIN_BIN="$TOOLCHAIN_ROOT/bin"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          echo "CROSS_COMPILE=$TOOLCHAIN_BIN/arm-linux-androideabi-" >> "$GITHUB_ENV"
          echo "Using GCC: $GCC"
          "$GCC" --version | head -1
          echo "Using G++: $GXX"
          "$GXX" --version | head -1

      - name: Fetch public APQ8084 source
        run: |
          git clone --depth 1 --branch lineage-18.1 https://github.com/apq8084/android_kernel_samsung_apq8084.git kernel

      - name: Port legacy gcc-wrapper to Python 3
        working-directory: kernel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/gcc-wrapper.py')
          s = p.read_text()
          s = s.replace('#! /usr/bin/env python', '#! /usr/bin/env python3')
          s = s.replace('        print "error, forbidden warning:", m.group(2)', '        print("error, forbidden warning:", m.group(2))')
          s = s.replace("        for line in proc.stderr:\n            print line,\n            interpret_warning(line)", "        for line in proc.stderr:\n            if isinstance(line, bytes):\n                line = line.decode('utf-8', errors='replace')\n            print(line, end='')\n            interpret_warning(line)")
          s = s.replace("            print args[0] + ':',e.strerror", "            print(args[0] + ':', e.strerror)")
          s = s.replace("            print 'Is your PATH set correctly?'", "            print('Is your PATH set correctly?')")
          s = s.replace("            print ' '.join(args), str(e)", "            print(' '.join(args), str(e))")
          p.write_text(s)
          PY
          python3 -m py_compile scripts/gcc-wrapper.py
          sed -n '50,110p' scripts/gcc-wrapper.py

      - name: Record source provenance
        run: |
          cd kernel
          git rev-parse HEAD | tee ../source-commit.txt
          make ARCH=arm kernelversion | tee ../kernel-version.txt
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile

      - name: Apply HID integration
        run: |
          python3 scripts/apply_hid.py kernel

      - name: Prepare tblte configuration
        working-directory: kernel
        run: |
          make ARCH=arm VARIANT_DEFCONFIG=apq8084_sec_tblte_eur_defconfig apq8084_sec_defconfig
          grep -E 'CONFIG_(USB_GADGET|USB_G_ANDROID|HID|USB_HID|UHID|CONFIGFS_FS)=' .config | tee ../hid-config.txt

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm
        run: |
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          make -j2 V=1 zImage dtbs

      - name: Verify outputs
        run: |
          test -s kernel/arch/arm/boot/zImage
          find kernel/arch/arm/boot/dts -type f \( -name '*tblte*.dtb' -o -name '*8084*.dtb' \) | head -20 | tee dtb-list.txt
          file kernel/arch/arm/boot/zImage

      - name: Package build artifacts
        run: |
          mkdir -p artifacts
          cp kernel/arch/arm/boot/zImage artifacts/
          cp source-commit.txt kernel-version.txt hid-config.txt artifacts/
          find kernel/arch/arm/boot/dts -type f \( -name '*tblte*.dtb' -o -name '*8084*.dtb' \) -exec cp {} artifacts/ \;
          tar -czf artifacts/tblte-hid-kernel-source-state.tar.gz patches scripts docs README.md

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tblte-hid-kernel-build
          path: artifacts/
